<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
    <style>
        body{
            font-family: cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url("https://i.pinimg.com/736x/9f/c3/fc/9fc3fc59d52dc24748feb8836feded7e.jpg");
            margin:0;
            background-repeat: no-repeat;
            background-size: cover;
        }

        form{
            background-color: rgb(246, 211, 245);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px black;
            width:400px;
        }
        legend{
            background-color:black;
            color: white;
            font-family: 'Times new Roman',Times, serif;
            padding:8px;
            border-radius: 5px;

        }
        fieldset{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <form >
        <fieldset>
           <legend>SIGN UP</legend>
           <table>
            
                <tr>
                    <td><label for="">Name:</label></td>
                    <td><input type="text" placeholder="ENTER UR NAME IN CAPS"><br></td>
                
                </tr>
                <tr>
                    <td><LABEL for="">PERSONAL EMAIL:</LABEL></td>
                    <td><input type="email" required></td>
                </tr>
                <tr>
                    <td><label for="">Password</label></td>
                    <td><input type="password"></td>
                </tr>
                
                    <td><label for="">DOB:</label></td>
                    <td><input type="date" required></td>
                </tr>
                <tr>
                    <td><label for="">GENDER:</label></td>
                    <td><input type="radio" id="male" name="gender" value="male">
                    <label for="male">MALE</label>
                    <input type="radio" id="feamle" name="gender" value="female">
                    <label for="female">FEMALE</label></td>
                </tr>
                <tr>
                    <td><label for="">TIME:</label></td>
                    <td><input type="time"></td>
                </tr>
                <tr>
                    <td><label for="">URL:</label></td>
                    <td><input type="url"></td>
                </tr>
                <tr>
                    <td><label for="" >Skills:</label></td>
                    <td> 
                        <input type="checkbox">HTML
                        <input type="checkbox">CSS
                        <input type="checkbox">Java script
                        <input type="checkbox">Other than other options
                    </td>
                </tr>
                <tr>
                    <td><label for="">Rate your skills</label></td>
                    <td><input type="range" min="0" max= "10"></td>
                </tr>
                <tr>
                    <td><label for="">CV</label></td>
                    <td><input type="file"></td>
                </tr> 



                <tr>
                    <td>
                        <input type="submit">
                    </td>
                </tr>


           </table>
        </fieldset>
    </form >
    
</body>
</html>
